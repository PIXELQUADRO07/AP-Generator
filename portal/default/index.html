<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Point - Login Hotspot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon-wrapper">
                <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
            <h2>Benvenuto nella Rete Wi-Fi</h2>
            <p class="subtitle">Accesso gratuito ad Internet per gli ospiti</p>

            <form action="/login" method="POST" id="loginForm">
                <div class="terms-box">
                    <label>
                        <input type="checkbox" id="acceptTerms" required checked>
                        <span>Accetto i termini e le condizioni d'uso del servizio di rete.</span>
                    </label>
                </div>
                <button type="submit" class="btn-connect" id="connectBtn">Connettiti a Internet</button>
            </form>

            <div class="footer">
                <span>Gestito con <strong>AP-Generator</strong></span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
